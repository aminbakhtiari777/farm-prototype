; Farm Town / مزرعهٔ شهر — multiplayer server config (v7b.1)
; Placeholders only. Amin fills these once the free host / Iranian VPS is ready.
; Override order (highest wins): in-game Settings → env FARM_SERVER_* → user://server.cfg → this file.

[server]
; Hostname or IP. NEVER connect when this is still YOUR_SERVER_HOST.
host="YOUR_SERVER_HOST"
; WebSocket game port (nginx may terminate TLS on 443 and proxy here).
port=9080
; true → clients build wss:// ; false → ws://
tls=false
; Optional path suffix, e.g. "/game" behind a reverse proxy. Usually empty.
path=""
; Max players per room (Amin's free host: keep 4–8).
max_per_room=6
; Hard cap across all rooms on one process.
max_players_total=24
; Separate lightweight HTTP /health port (keepalive / free-tier pingers).
health_port=9081
; Client → server ping interval (seconds).
heartbeat_sec=20.0
; Drop a peer after this many seconds without a ping.
heartbeat_timeout_sec=60.0
; Game / protocol version string sent in hello (must match for multiplayer).
game_version="7.1.0"
; Allow older clients that share the same major.minor (e.g. 7.1.x).
compat_prefix="7.1."

[local_network]
; Home Wi-Fi test server (Amin's Windows 10 PC). Shown in the lobby as an extra choice.
; ONLY works for phones/laptops on the SAME Wi-Fi / router as that PC — friends over
; the internet cannot reach a 192.168.x.x address (use [server] host for that).
; The main [server] host above stays the placeholder; nothing connects until a player
; picks "Local network" in the lobby. Start the server with tools/start_server_windows.bat.
label_fa="شبکهٔ خانگی"
label_en="Local network"
; The PC's IPv4 on the home network (Win+R -> cmd -> ipconfig; it can change after a router restart).
host="192.168.1.57"
; WebSocket game port (same default as [server]).
port=9080
; HTTP /health port for the live player counter + keep-alive (same default as [server]).
health_port=9081
; Plain ws:// on the LAN (no certificate).
tls=false

[updates]
; URL of the versioned update manifest JSON (empty = never check; offline keeps playing).
manifest_url=""
packs_base_url=""

[brand]
; Product family: Zamith / Zamis. Display title (Persian default / English).
title_fa="مزرعهٔ شهر"
title_en="Farm Town"
; Short app / binary name (Windows .exe, Android label, macOS .app).
app_name="FarmTown"
; Bundle / package id placeholders (fill before store release).
android_package="ir.zamith.farmtown"
ios_bundle="ir.zamith.farmtown"
macos_bundle="ir.zamith.FarmTown"
; Social QR codes on the title / lobby screen. Empty / YOUR_ = QR hidden.
github_url="https://github.com/aminbakhtiari777"
linkedin_url="YOUR_LINKEDIN_URL"
